            <!-- Add New Car Form -->
            <section class="container">
                <h2 class="text-right mb-12">Add New Car</h2>
                <div class="card shadow-sm p-4">
                    <form
                        action="submit_car.php"
                        method="POST"
                        enctype="multipart/form-data"
                    >
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="car_name" class="form-label"
                                    >Car Name</label
                                >
                                <input
                                    type="text"
                                    class="form-control"
                                    id="car_name"
                                    name="car_name"
                                    required
                                />
                            </div>
                            <div class="col-md-6">
                                <label for="brand" class="form-label"
                                    >Brand</label
                                >
                                <input
                                    type="text"
                                    class="form-control"
                                    id="brand"
                                    name="brand"
                                    required
                                />
                            </div>
                            <div class="col-md-6">
                                <label for="model" class="form-label"
                                    >Model</label
                                >
                                <input
                                    type="text"
                                    class="form-control"
                                    id="model"
                                    name="model"
                                    required
                                />
                            </div>
                            <div class="col-md-6">
                                <label for="year" class="form-label"
                                    >Year of Manufacture</label
                                >
                                <input
                                    type="number"
                                    class="form-control"
                                    id="year"
                                    name="year"
                                    required
                                />
                            </div>
                            <div class="col-md-6">
                                <label for="car_type" class="form-label"
                                    >Car Type</label
                                >
                                <select
                                    class="form-select"
                                    id="car_type"
                                    name="car_type"
                                    required
                                >
                                    <option value="SUV">SUV</option>
                                    <option value="Sedan">Sedan</option>
                                    <option value="Convertible">
                                        Convertible
                                    </option>
                                    <option value="Coupe">Coupe</option>
                                    <option value="Hatchback">Hatchback</option>
                                    <option value="Truck">Truck</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="daily_rent_price" class="form-label"
                                    >Daily Rent Price</label
                                >
                                <input
                                    type="number"
                                    class="form-control"
                                    id="daily_rent_price"
                                    name="daily_rent_price"
                                    required
                                />
                            </div>
                            <div class="col-md-6">
                                <label
                                    for="availability_status"
                                    class="form-label"
                                    >Availability Status</label
                                >
                                <select
                                    class="form-select"
                                    id="availability_status"
                                    name="availability_status"
                                    required
                                >
                                    <option value="Available">Available</option>
                                    <option value="Not Available">
                                        Not Available
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="car_image" class="form-label"
                                    >Car Image</label
                                >
                                <input
                                    type="file"
                                    class="form-control"
                                    id="car_image"
                                    name="car_image"
                                    accept="image/*"
                                    required
                                />
                            </div>
                        </div>
                        <div class="mt-4 text-right">
                            <button type="submit" class="btn btn-success me-2">
                                Add Car
                            </button>
                            <a
                                href="car_management.html"
                                class="btn btn-secondary"
                                >Back to Car Management</a
                            >
                        </div>
                    </form>
                </div>
            </section>
        </div>
