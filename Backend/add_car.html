        <!-- Main Content -->
        <div class="container-fluid">
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
                <div class="container-fluid">
                    <a class="navbar-brand" href="admin_dashboard.html">Admin Dashboard</a>
                </div>
            </nav>

            <!-- Add New Car Form -->
            <section class="container my-5">
                <h2 class="text-center mb-4">Add New Car</h2>

                <div class="row justify-content-center">
                    <div class="col-lg-8 col-md-10 col-sm-12">
                        <div class="card shadow-lg">
                            <div class="card-body">
                                <form action="submit_car.php" method="POST" enctype="multipart/form-data">
                                    <div class="mb-3">
                                        <label for="car_name" class="form-label">Car Name</label>
                                        <input type="text" class="form-control" id="car_name" name="car_name" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="brand" class="form-label">Brand</label>
                                        <input type="text" class="form-control" id="brand" name="brand" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="model" class="form-label">Model</label>
                                        <input type="text" class="form-control" id="model" name="model" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="year" class="form-label">Year of Manufacture</label>
                                        <input type="number" class="form-control" id="year" name="year" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="car_type" class="form-label">Car Type</label>
                                        <select class="form-select" id="car_type" name="car_type" required>
                                            <option value="SUV">SUV</option>
                                            <option value="Sedan">Sedan</option>
                                            <option value="Convertible">Convertible</option>
                                            <option value="Coupe">Coupe</option>
                                            <option value="Hatchback">Hatchback</option>
                                            <option value="Truck">Truck</option>
                                        </select>
                                    </div>

                                    <div class="mb-3">
                                        <label for="daily_rent_price" class="form-label">Daily Rent Price</label>
                                        <input type="number" class="form-control" id="daily_rent_price"
                                            name="daily_rent_price" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="availability_status" class="form-label">Availability Status</label>
                                        <select class="form-select" id="availability_status" name="availability_status"
                                            required>
                                            <option value="Available">Available</option>
                                            <option value="Not Available">Not Available</option>
                                        </select>
                                    </div>

                                    <div class="mb-3">
                                        <label for="car_image" class="form-label">Car Image</label>
                                        <input type="file" class="form-control" id="car_image" name="car_image"
                                            accept="image/*" required>
                                    </div>

                                    <button type="submit" class="btn btn-success">Add Car</button>
                                    <a href="car_management.html" class="btn btn-secondary ms-2">Back to Car
                                        Management</a>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
